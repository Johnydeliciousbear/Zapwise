<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>ZapWise home</title>
<link rel="stylesheet" href="zapwise.css">
<style>
  .quest { margin: 14px 16px 0; padding: 14px 16px; display: grid; grid-template-columns: 40px 1fr; gap: 6px 12px; align-items: center; }
  .quest .ic { grid-row: span 2; width: 40px; height: 40px; border-radius: 12px; box-shadow: var(--inset-sm); display: grid; place-items: center; }
  .quest .t { font: 800 16px/1.2 'Nunito'; }
  .quest .row { display: flex; align-items: center; gap: 10px; }
  .quest .row .track { flex: 1; }
  .quest .row span { font: 600 15px/1 'Pixelify Sans'; color: var(--cocoa-2); }
  .scene { position: relative; margin-top: 26px; width: 392px; height: 432px; overflow: hidden; }
  .scene img { position: absolute; left: 0; top: 0; width: 392px; height: 432px; }
  .pill { display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px 0 8px; border-radius: 999px; box-shadow: var(--raised-sm); font: 600 18px/1 'Pixelify Sans'; }
  .scene::after { content: ''; position: absolute; inset: 0; box-shadow: inset 0 10px 12px -8px var(--shade), inset 0 -10px 12px -8px var(--shade); pointer-events: none; }
  .cta-wrap { position: absolute; left: 16px; right: 16px; bottom: 114px; }
  .tabwrap { position: absolute; left: 12px; right: 12px; bottom: 22px; }
</style></head>
<body>
<div class="phone" id="shot">
  <div class="status"><span>9:41</span><span>5G 100%</span></div>
  <div class="topbar">
    <img class="px" src="img/wordmark.png" style="width:142px;height:42px">
    <div class="pill"><img class="px" src="img/icon_star.png" style="width:32px;height:32px">12</div>
  </div>
  <div class="raised quest">
    <div class="ic"><img class="px" src="img/icon_star.png" style="width:32px;height:32px"></div>
    <div class="t">Plate it 3 times this week</div>
    <div class="row"><div class="track"><i style="width:66%"></i></div><span>2/3</span></div>
  </div>
  <div class="scene"><img class="px" src="img/kitchen.png"></div>
  <div class="bubble" style="left:40px; top:384px; width:178px">Tap Zappy to set your microwave's watts</div>
  <style>.bubble::after{ left: 78px; bottom: -8px; }</style>
  <div class="cta-wrap"><div class="cta"><img class="px" src="img/icon_camera.png" style="width:32px;height:32px"> Scan before you heat</div></div>
  <div class="tabwrap"><div class="tabbar">
    <div class="tab on"><img class="px" src="img/icon_kitchen.png" style="width:32px;height:32px">Kitchen</div>
    <div class="tab"><img class="px" src="img/icon_log.png" style="width:32px;height:32px">Log</div>
    <div class="tab"><img class="px" src="img/icon_learn.png" style="width:32px;height:32px">Learn</div>
    <div class="tab"><img class="px" src="img/icon_me.png" style="width:32px;height:32px">Me</div>
  </div></div>
</div>
</body></html>
