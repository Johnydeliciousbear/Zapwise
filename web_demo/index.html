<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZapWise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* the hidden attribute must win over display rules (the sheet and coach overlays use display:flex) */
[hidden] { display: none !important; }
/* Layout: one phone-sized app; pixel kitchen as the home, soft UI cards and sheets around it. Single warm-pink look by design. */
:root {
  --milk: #FDE9E7;      /* app ground and soft surfaces */
  --stage: #F6D9D7;     /* desktop backdrop around the phone */
  --shade: #E9C3C2;     /* soft shadow, bottom right */
  --glow: #FFFFFF;      /* soft highlight, top left */
  --cocoa: #4B2E39;     /* text and pixel outline */
  --cocoa-2: #8A5F6C;   /* secondary text */
  --rose: #E0607A;      /* brand graphics only */
  --rose-deep: #B23A57; /* links, active labels */
  --straw: #F59BAA;     /* pixel button fill */
  --straw-shade: #E27C8F;
  --blush: #FBC9CF;
  --butter: #FFE3A3;
  --mint: #A8DCC6;
  --mint-deep: #2E6E58;
  --peach: #FFC4A3;
  --sky: #C6E6F3;
  --paper: #FFFFFF;
  --dim: rgba(75, 46, 57, 0.58);
  --display: 'Fredoka', 'Nunito', ui-rounded, system-ui, sans-serif;
  --body: 'Nunito', ui-rounded, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --raised: 6px 6px 14px var(--shade), -6px -6px 14px var(--glow);
  --raised-sm: 3px 3px 8px var(--shade), -3px -3px 8px var(--glow);
  --inset: inset 4px 4px 9px var(--shade), inset -4px -4px 9px var(--glow);
  --inset-sm: inset 2px 2px 5px var(--shade), inset -2px -2px 5px var(--glow);
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--stage); color: var(--cocoa); font-family: var(--body); font-weight: 600; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--rose-deep); outline-offset: 2px; }
img.px { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
h1, h2, h3, p { margin: 0; }

.stage { min-height: 100%; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 28px; padding-block: 24px; padding-inline: 16px; }
.phone { position: relative; width: 392px; height: min(844px, calc(100dvh - 48px)); min-height: 640px; background: var(--milk); border-radius: 40px; overflow: hidden; box-shadow: 0 30px 60px -20px rgba(75, 46, 57, 0.35), 0 0 0 10px var(--paper), 0 0 0 12px var(--shade); display: flex; flex-direction: column; }
.side-note { max-width: 260px; display: grid; gap: 12px; font-size: 14px; line-height: 1.45; color: var(--cocoa-2); }
.side-note h2 { font: 600 22px/1.2 var(--display); color: var(--cocoa); text-wrap: balance; }
.side-note .row { display: flex; gap: 10px; flex-wrap: wrap; }
@media (max-width: 520px) {
  .stage { padding: 0; gap: 0; display: block; height: 100%; min-height: 0; }
  .phone { width: 100%; height: 100%; min-height: 0; border-radius: 0; box-shadow: none; }
  .side-note { display: none; }
}

.view { flex: 1; overflow-y: auto; overflow-x: hidden; padding-bottom: 24px; scrollbar-width: none; }
.view::-webkit-scrollbar { display: none; }
.view.with-tabs { padding-bottom: 104px; }

/* surfaces */
.raised { background: var(--milk); border-radius: 22px; box-shadow: var(--raised); }
.well { background: var(--milk); border-radius: 18px; box-shadow: var(--inset); }
.pad { padding: 14px 16px; }
.wrap { padding-inline: 16px; display: grid; gap: 14px; }

/* top bar */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 8px; min-height: 64px; }
.topbar .title { font: 600 21px/1.2 var(--display); text-align: center; flex: 1; }
.round { width: 44px; height: 44px; border-radius: 50%; box-shadow: var(--raised-sm); display: grid; place-items: center; flex: none; font: 800 22px/1 var(--body); }
.round:active { box-shadow: var(--inset-sm); }
.pill { display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px 0 8px; border-radius: 999px; box-shadow: var(--raised-sm); font: 600 18px/1 var(--display); font-variant-numeric: tabular-nums; }

/* buttons */
.cta { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 58px; padding: 0 16px; border: 3px solid var(--cocoa); border-radius: 6px; background: var(--straw); color: var(--cocoa); font: 600 19px/1.1 var(--display); box-shadow: 0 5px 0 var(--cocoa); position: relative; text-align: center; transition: transform .08s, box-shadow .08s; }
.cta::after { content: ''; position: absolute; left: 6px; right: 6px; top: 4px; height: 4px; background: var(--blush); border-radius: 2px; pointer-events: none; }
.cta:active { transform: translateY(5px); box-shadow: 0 0 0 var(--cocoa); }
.cta[disabled] { background: #EED9DB; color: #8E7480; border-color: #B79AA3; box-shadow: 0 5px 0 #B79AA3; cursor: default; }
.cta[disabled]::after { display: none; }
.soft { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 14px; border-radius: 16px; background: var(--milk); box-shadow: var(--raised-sm); font: 800 16px/1.25 var(--body); }
.soft:active, .soft[aria-pressed="true"] { box-shadow: var(--inset-sm); }
.soft .sub { margin-left: auto; font: 700 13px/1.2 var(--body); color: var(--cocoa-2); text-align: right; }
.soft .sub b { color: var(--mint-deep); font-weight: 800; }
.soft .txt { display: grid; gap: 2px; min-width: 0; }
.soft .txt small { font: 700 12.5px/1.3 var(--body); color: var(--cocoa-2); }
.link { color: var(--rose-deep); font: 800 14px/1.2 var(--body); border-bottom: 1.5px solid currentColor; padding-bottom: 1px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 3px 12px 3px 8px; border-radius: 999px; border: 2px solid var(--cocoa); font: 800 13px/1 var(--body); background: var(--paper); }
.chip.lower { background: var(--mint); } .chip.middle { background: var(--butter); } .chip.higher { background: var(--peach); }
.tag { display: inline-block; padding: 3px 8px; border-radius: 6px; background: var(--butter); font: 800 11px/1.2 var(--body); letter-spacing: .02em; }
.choice { display: flex; flex-wrap: wrap; gap: 8px; }
.choice button { min-height: 44px; padding: 0 14px; border-radius: 999px; box-shadow: var(--raised-sm); font: 800 14px/1 var(--body); }
.choice button[aria-pressed="true"] { box-shadow: var(--inset-sm); color: var(--rose-deep); background: var(--blush); }
.muted { color: var(--cocoa-2); }
.small { font-size: 13px; line-height: 1.4; }
.h2 { font: 600 18px/1.2 var(--display); }
.h3 { font: 600 16px/1.25 var(--display); }

/* home */
.quest-banner { display: grid; grid-template-columns: 44px 1fr; gap: 6px 12px; align-items: center; margin: 4px 16px 0; padding: 12px 14px; width: calc(100% - 32px); }
.quest-banner .ic { grid-row: span 2; width: 44px; height: 44px; border-radius: 12px; box-shadow: var(--inset-sm); display: grid; place-items: center; }
.quest-banner .t { font: 600 16px/1.2 var(--display); }
.quest-banner .row { display: flex; align-items: center; gap: 10px; }
.track { flex: 1; height: 14px; border-radius: 999px; box-shadow: var(--inset-sm); padding: 3px; overflow: hidden; background: var(--milk); }
.track > i { display: block; height: 100%; border-radius: 999px; background: var(--butter); border: 1.5px solid var(--cocoa); min-width: 8px; transition: width .4s; }
.count { font: 600 15px/1 var(--display); color: var(--cocoa-2); font-variant-numeric: tabular-nums; }
.scene { position: relative; width: 100%; aspect-ratio: 196 / 216; margin-top: 14px; max-width: 100%; }
.scene > img.base { position: absolute; inset: 0; width: 100%; height: 100%; }
.scene .hot { position: absolute; display: block; border-radius: 6px; }
.scene .hot img { width: 100%; height: 100%; }
.scene .hot:focus-visible { outline-offset: 1px; }
.scene .slot { border: 2px dashed var(--straw-shade); display: grid; place-items: center; color: var(--straw-shade); font: 700 26px/1 var(--display); background: rgba(255, 255, 255, .35); }
.scene .item { position: absolute; pointer-events: none; }
.scene .spark { position: absolute; width: 4.6%; pointer-events: none; animation: twinkle 1.6s ease-in-out infinite; }
@keyframes twinkle { 50% { transform: scale(.7); opacity: .6; } }
.zappy-hop { animation: hop .5s ease-out; }
@keyframes hop { 30% { transform: translateY(-8%); } }
.home-cta { padding: 10px 16px 0; }
.scene { max-width: 100%; }

/* tabbar */
.tabbar { position: absolute; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: space-around; align-items: center; height: 76px; border-radius: 28px; background: var(--milk); box-shadow: var(--raised); padding: 0 8px; z-index: 5; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 78px; padding: 7px 0 6px; border-radius: 18px; font: 800 12px/1 var(--body); color: var(--cocoa-2); }
.tab[aria-current="page"] { box-shadow: var(--inset-sm); color: var(--rose-deep); }

/* scan */
.viewfinder { position: relative; margin: 6px 16px 0; height: 300px; border-radius: 24px; background: #2F1F27; display: grid; place-items: center; overflow: hidden; }
.viewfinder::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 50% 45%, rgba(255, 255, 255, .10), transparent 60%); }
.viewfinder .corner { position: absolute; width: 34px; height: 34px; border: 4px solid var(--paper); }
.vf-hint { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center; color: var(--paper); font: 700 13px/1.3 var(--body); }
.samples { padding: 16px 16px 0; display: grid; gap: 10px; }
.sample-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.sample { display: flex; align-items: center; gap: 10px; min-height: 60px; padding: 8px 10px; border-radius: 14px; box-shadow: var(--raised-sm); font: 800 13px/1.2 var(--body); }
.sample[aria-pressed="true"] { box-shadow: var(--inset-sm); background: var(--blush); }
.shutter-row { display: flex; justify-content: center; padding: 18px 0 22px; }
.shutter { width: 76px; height: 76px; border-radius: 50%; background: var(--straw); border: 4px solid var(--cocoa); box-shadow: 0 5px 0 var(--cocoa), inset 0 0 0 5px var(--blush); display: grid; place-items: center; }
.shutter:active { transform: translateY(5px); box-shadow: 0 0 0 var(--cocoa), inset 0 0 0 5px var(--blush); }

/* reading */
.reading { display: grid; justify-items: center; gap: 18px; padding: 48px 24px; text-align: center; }
.checks { width: 100%; display: grid; gap: 10px; }
.check-row { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; box-shadow: var(--inset-sm); font: 700 14px/1.3 var(--body); text-align: left; opacity: .45; transition: opacity .3s; }
.check-row.on { opacity: 1; }

/* product */
.product { display: grid; grid-template-columns: 78px 1fr; gap: 14px; align-items: center; }
.thumb { width: 78px; height: 78px; border-radius: 16px; box-shadow: var(--inset-sm); display: grid; place-items: center; }
.product h2 { font: 600 18px/1.2 var(--display); }
.product p { font: 700 13px/1.4 var(--body); color: var(--cocoa-2); margin-top: 3px; }
.steps { display: grid; gap: 4px; }
.step { display: grid; grid-template-columns: 32px 1fr; gap: 12px; align-items: center; min-height: 44px; font: 700 15px/1.3 var(--body); }
.time-well { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; }
.time-well .big { font: 600 34px/1 var(--display); font-variant-numeric: tabular-nums; }
.warn { border: 3px solid var(--cocoa); border-radius: 16px; background: var(--peach); padding: 14px; display: grid; gap: 8px; }
.warn .hd { display: flex; align-items: center; gap: 10px; font: 600 17px/1.2 var(--display); }

/* result */
.gauge-card { display: grid; grid-template-columns: 168px 1fr; gap: 12px; align-items: center; padding: 16px; }
.ring { width: 168px; height: 168px; border-radius: 50%; box-shadow: var(--inset); position: relative; display: grid; place-items: center; }
.ring svg { position: absolute; inset: 0; }
.ring .v { text-align: center; position: relative; }
.ring .v b { display: block; font: 600 40px/1 var(--display); font-variant-numeric: tabular-nums; }
.ring .v span { font: 800 12px/1.25 var(--body); color: var(--cocoa-2); }
.side { display: grid; gap: 10px; justify-items: start; }
.who { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; padding: 6px; }
.who button { border-radius: 14px; padding: 10px 12px; font: 800 14px/1.2 var(--body); display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 44px; }
.who button[aria-pressed="true"] { box-shadow: var(--raised-sm); }
.who b { font: 600 19px/1 var(--display); font-variant-numeric: tabular-nums; }
.foot { font: 700 12.5px/1.45 var(--body); color: var(--cocoa-2); }

/* tips and coach */
.tip { display: grid; grid-template-columns: 46px 1fr; gap: 10px; align-items: start; background: var(--paper); border: 3px solid var(--cocoa); border-radius: 6px; padding: 10px 12px; box-shadow: 4px 4px 0 var(--cocoa); font: 700 14px/1.4 var(--body); }
.tip .act { grid-column: 2; justify-self: end; }
.coach { position: absolute; inset: 0; z-index: 30; }
.coach .ring-hole { position: absolute; border-radius: 14px; box-shadow: 0 0 0 9999px var(--dim); border: 3px solid var(--butter); transition: all .25s; pointer-events: none; }
.coach .ring-hole.none { left: 50%; top: 40%; width: 0; height: 0; border: 0; }
.coach .bubble { position: absolute; left: 16px; right: 16px; background: var(--paper); border: 3px solid var(--cocoa); border-radius: 6px; box-shadow: 4px 4px 0 var(--cocoa); padding: 12px 14px; display: grid; grid-template-columns: 60px 1fr; gap: 12px; align-items: start; }
.coach .bubble p { font: 700 15px/1.4 var(--body); }
.coach .bubble .btns { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; }
.coach .dots { display: flex; gap: 6px; }
.coach .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--blush); border: 1.5px solid var(--cocoa); }
.coach .dots i.on { background: var(--rose); }
.mini-btn { min-height: 40px; padding: 0 16px; border: 2.5px solid var(--cocoa); border-radius: 6px; background: var(--straw); font: 600 15px/1 var(--display); box-shadow: 0 3px 0 var(--cocoa); }
.mini-btn:active { transform: translateY(3px); box-shadow: none; }
.mini-btn.ghost { background: var(--paper); }

/* sheet */
.sheet-wrap { position: absolute; inset: 0; z-index: 20; display: flex; align-items: flex-end; }
.sheet-wrap .backdrop { position: absolute; inset: 0; background: var(--dim); animation: fade .2s; }
.sheet { position: relative; width: 100%; max-height: 88%; overflow-y: auto; background: var(--milk); border-radius: 28px 28px 0 0; padding: 10px 16px calc(24px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; animation: rise .25s ease-out; }
.sheet .grab { width: 44px; height: 5px; border-radius: 3px; background: var(--shade); justify-self: center; }
.sheet .sh-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sheet .sh-head h2 { font: 600 20px/1.2 var(--display); }
@keyframes rise { from { transform: translateY(40px); opacity: .4; } }
@keyframes fade { from { opacity: 0; } }
.toast { position: absolute; left: 50%; bottom: 112px; transform: translateX(-50%); background: var(--cocoa); color: var(--paper); padding: 10px 16px; border-radius: 999px; font: 800 14px/1.2 var(--body); z-index: 40; white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; }
.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.tile { display: grid; justify-items: center; gap: 8px; padding: 14px 8px; border-radius: 16px; box-shadow: var(--raised-sm); font: 800 13px/1.25 var(--body); text-align: center; min-height: 112px; align-content: center; }
.tile[aria-pressed="true"] { box-shadow: var(--inset-sm); background: var(--blush); }
.list { display: grid; gap: 10px; }
.formula { font: 700 14px/1.6 var(--body); padding: 12px 14px; overflow-x: auto; }
table.params { width: 100%; border-collapse: collapse; font: 700 13px/1.35 var(--body); }
table.params td, table.params th { padding: 7px 6px; border-bottom: 1px solid var(--shade); text-align: left; vertical-align: top; }
table.params th { font: 800 12px/1.2 var(--body); color: var(--cocoa-2); }
table.params td.n { text-align: right; font-variant-numeric: tabular-nums; }

/* log */
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 6px; }
.seg button { min-height: 44px; border-radius: 14px; font: 800 14px/1 var(--body); color: var(--cocoa-2); }
.seg button[aria-pressed="true"] { box-shadow: var(--raised-sm); color: var(--rose-deep); }
.entry { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; }
.entry .when { font: 700 12.5px/1.3 var(--body); color: var(--cocoa-2); }
.entry b { font: 800 15px/1.2 var(--body); }
.bars text { font: 700 11px var(--body); fill: var(--cocoa-2); }
.bars .val { font: 600 12px var(--display); fill: var(--cocoa); }
.empty { display: grid; justify-items: center; gap: 12px; text-align: center; padding: 28px 18px; }

.field { width: 100%; min-height: 48px; border-radius: 14px; border: 2px solid var(--cocoa); padding: 0 14px; font: 700 16px var(--body); background: #fff; color: var(--cocoa); }
.sci summary, .limits summary { cursor: pointer; }
/* quick estimate */
.qgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.qcell { display: grid; justify-items: center; gap: 6px; padding: 12px 8px; border-radius: 16px; font: 800 12.5px/1.25 var(--body); color: var(--cocoa); text-align: center; min-height: 96px; align-content: center; }
.qcell[aria-pressed="true"] { background: var(--blush, #FBC9CF); color: var(--rose-deep); outline: 3px solid var(--cocoa); }
.limits summary { cursor: pointer; min-height: 32px; }

/* learn */
.card-t { display: flex; align-items: center; gap: 10px; font: 600 17px/1.2 var(--display); margin-bottom: 6px; }
.learn p { font: 600 14.5px/1.5 var(--body); }
.learn p + p { margin-top: 8px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<div class="stage">
  <main class="phone" id="phone" aria-label="ZapWise app prototype">
    <div class="view" id="view"></div>
    <nav class="tabbar" id="tabbar" aria-label="Main">
      <button class="tab" data-act="tab" data-to="home"><img class="px" src="img/icon_kitchen.png" alt="" width="32" height="32">Kitchen</button>
      <button class="tab" data-act="tab" data-to="log"><img class="px" src="img/icon_log.png" alt="" width="32" height="32">Log</button>
      <button class="tab" data-act="tab" data-to="learn"><img class="px" src="img/icon_learn.png" alt="" width="32" height="32">Learn</button>
      <button class="tab" data-act="tab" data-to="me"><img class="px" src="img/icon_me.png" alt="" width="32" height="32">Me</button>
    </nav>
    <div class="sheet-wrap" id="sheet" hidden><div class="backdrop" data-act="closeSheet"></div><section class="sheet" id="sheetBody" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></section></div>
    <div class="coach" id="coach" hidden></div>
    <div class="toast" id="toast" role="status" hidden></div>
  </main>
  <aside class="side-note">
    <img class="px" src="img/zappy_happy.png" alt="Zappy" width="126" height="96">
    <h2>ZapWise prototype</h2>
    <p>Tap around the kitchen, scan a sample box and save how you heated it. Products and percentages are sample values for the demo.</p>
    <div class="row"><button class="mini-btn ghost" data-act="replayTour">Replay tour</button><button class="mini-btn ghost" data-act="resetAsk">Reset demo</button></div>
  </aside>
</div>

<script src="data.js"></script>
<script src="engine.js"></script>
<script>
(function () {
'use strict';

/* ---------------- data ---------------- */
/* ---------------- real data and engine ----------------
   Products, containers and limits come from app/assets/data (the same files the Flutter app ships),
   and every number comes from engine.js, a line-by-line port of the Python reference engine. */
var ZD = window.ZW_DATA;
var ENG = new ZapEngine.Engine(ZD.params, {});
var REAL2KIND = { cpet_tray: 'cpet', pp_container: 'pp', takeout_tub: 'deli', pet_clamshell: 'pet', eps_foam: 'eps', glass: 'glass', ceramic: 'plate', stove_pot: 'pot',
  paperboard_tray: 'paper', pet_board_tray: 'petboard', paper_cup: 'papercup', steam_bag: 'steam', pouch: 'pouch', popcorn_bag: 'popcorn', susceptor_sleeve: 'sleeve', ps_rigid: 'psrigid', metal: 'metal' };
var KIND_ART = { cpet: ['cpet_tray', 24, 9, 'tray'], pp: ['pp_tray', 24, 10, 'container'], deli: ['deli_tub', 18, 13, 'tub'], pet: ['pet_clam', 20, 11, 'clamshell'],
  eps: ['foam_box', 22, 13, 'foam box'], glass: ['glass_box', 20, 13, 'glass dish'], plate: ['plates', 26, 10, 'plate'], pot: ['pot', 26, 17, 'pot'],
  paper: ['paper_tray', 24, 9, 'tray'], petboard: ['paper_tray', 24, 9, 'tray'], papercup: ['paper_cup', 14, 16, 'cup'], steam: ['steam_bag', 20, 17, 'bag'],
  pouch: ['pouch', 16, 19, 'pouch'], popcorn: ['popcorn_bag', 18, 15, 'bag'], sleeve: ['sleeve', 20, 12, 'sleeve'], psrigid: ['foam_box', 22, 13, 'container'], metal: ['can', 14, 15, 'container'] };
var CONT = {};
Object.keys(REAL2KIND).forEach(function (key) {

o.", "No cooking steps on file": "No tengo los pasos de cocción", "I need the microwave directions from the box to estimate this one. Moving the meal to a plate needs no estimate.": "Necesito las instrucciones de microondas de la caja para calcular este. Si lo pasas a un plato, no hace falta calcular.", "This counts only what moves from the container while it heats. Chemicals added at the factory are not part of it.": "Esto cuenta solo lo que pasa del envase a la comida al calentarla. Los químicos de la fábrica no se incluyen.", "Ways to lower it": "Cómo bajarlo", "A pot on the stove": "Una olla en la estufa", "Saving": "Guardando", "Save how I heated it": "Guardar cómo lo calenté", "Counts what moves from the container during heating only. This is an estimate, not a diagnosis. ": "Cuenta solo lo que sale del envase al calentar. Es un cálculo aproximado, no un diagnóstico. ", "Glass, ceramic and steel add no plastic chemicals.": "El vidrio, la cerámica y el acero no agregan químicos de plástico.", "From lab measurements": "De mediciones de laboratorio", "Details for the science fair": "Detalles para la feria de ciencias", "The daily limit is how much of these chemicals health agencies say a person can take in every day for life without a known health risk.": "El límite diario es cuánto de estos químicos, según las agencias de salud, una persona puede recibir cada día de su vida sin un riesgo conocido para la salud.", "Heating past the box time adds the most. Stick to the box time, or move it to a plate.": "Calentar más de lo que dice la caja es lo que más suma. Sigue el tiempo de la caja, o pásalo a un plato.", "This is shorter than the box says. The middle may not reach 165°F (74°C), so check before you eat.": "Esto es menos tiempo del que dice la caja. Puede que el centro no llegue a 165°F (74°C); revísalo antes de comer.", "The container wall gets hotter than the temperature it is rated for.": "La pared del envase se calienta más de lo que aguanta.", "The plastic gets hotter than the range the diffusion model was checked for, so treat the number as rough.": "El plástico se calienta más de lo que se probó en el modelo, así que toma el número como aproximado.", "Antimony numbers come from lab tests at 120 to 150°C, a little hotter than most microwave heating.": "Los números de antimonio vienen de pruebas a 120–150°C, un poco más caliente que el microondas normal.", "The fat content is not on file, so I assumed a medium-fat meal.": "No tengo la grasa de este producto, así que supuse una comida con grasa media.", "The box does not say which wattage its times are for, so I assumed 1100 W.": "La caja no dice para qué vatios son los tiempos, así que supuse 1100 W.", "The box says this meal needs a stronger microwave than yours.": "La caja dice que esta comida necesita un microondas más fuerte que el tuyo.", "Your wattage is outside the box's table, so I stretched the nearest row.": "Tus vatios no están en la tabla de la caja, así que usé la fila más cercana.", "This number comes from lab measurements of similar cups, not from the model.": "Este número viene de mediciones de vasos parecidos, no del modelo.", "Oven steps are not part of the estimate.": "Los pasos de horno no entran en el cálculo.", "In a pot on the stove": "En una olla en la estufa", "On a ceramic plate, microwave": "En un plato de cerámica, microondas", "In a glass dish, microwave": "En un recipiente de vidrio, microondas", "No plastic": "Sin plástico", "Microwave OK": "Apto para microondas", "Not for heating": "No es para calentar", "Check the label": "Revisa la etiqueta", "Adult": "Adulto", "Teen, 13 to 17": "Adolescente, 13 a 17", "Kid, 8 to 12": "Niño, 8 a 12", "Toddler, 1 to 3": "Bebé, 1 a 3", "Snap the label": "Toma foto de la etiqueta", "The label is inside the door or on the back": "La etiqueta está dentro de la puerta o atrás", "I couldn't find the watts in that photo. Pick them below, or try the boil test.": "No encontré los vatios en esa foto. Elígelos a  goes in the basket, not in its plastic tray, so the tray chemicals ZapWise counts stay out.": "Ya está en tu cocina. Todavía no calculo la freidora de aire. La comida va en la canasta, no en su bandeja de plástico, así que los químicos de la bandeja no entran.", "Get the number in a triangle and any words like \"microwave safe\" in view": "Que se vea el número dentro del triángulo y palabras como \"microwave safe\"", "Nickname, e.g. Mom's glass box (optional)": "Apodo, ej. el recipiente de vidrio de mamá (opcional)", "Turn the tray over. A number in a triangle and words like \"dual ovenable\" or \"microwave safe\" tell trays apart. Color does not: black trays can be either kind.": "Voltea la bandeja. El número dentro del triángulo y palabras como \"dual ovenable\" o \"microwave safe\" ayudan a distinguirlas. El color no: las bandejas negras pueden ser de los dos tipos.", "Snap the container from the side. If there's a number in a triangle on the bottom, snap that too.": "Toma foto del recipiente de lado. Si tiene un número dentro de un triángulo abajo, tómale foto también.", "e.g. Healthy Choice": "ej. Healthy Choice", "e.g. Chicken Teriyaki Bowl": "ej. Chicken Teriyaki Bowl", "Bands: Lower, Middle, Higher": "Niveles: Más bajo, Medio, Más alto", "The box gives oven directions only.": "La caja solo trae instrucciones para horno.", "Heating longer": "Calentar más tiempo", "Heating less": "Calentar menos tiempo", "Electric kettle": "Hervidor eléctrico", "It's on your counter. Toaster oven heating isn't estimated yet. Food goes on the metal rack or a pan, so the plastic tray stays out.": "Ya está en tu cocina. Todavía no calculo el horno tostador. La comida va en la rejilla de metal o en una bandeja, así que la bandeja de plástico no entra.", "It's on your counter. For cup noodles, boil water here and pour it over the noodles in a bowl. That skips the paper or foam cup.": "Ya está en tu cocina. Para la sopa instantánea, hierve el agua aquí y sírvela sobre los fideos en un tazón. Así evitas el vaso de papel o de espuma.", "Nothing heated today yet": "Nada calentado hoy", "See the last 7 days": "Ver los últimos 7 días", "Something went wrong while reading the box. Try another photo, or find the meal by name.": "Algo salió mal al leer la caja. Toma otra foto o busca la comida por nombre.", "Made by Woosung Choi, a California high school student, for the Congressional App Challenge. The kitchen, Zappy and every icon are original pixel art. The science, data and code were built with help from an AI assistant, and every number traces back to a source in the ZapWise database.": "Hecha por Woosung Choi, un estudiante de preparatoria de California, para el Congressional App Challenge. La cocina, Zappy y cada ícono son pixel art original. La ciencia, los datos y el código se hicieron con ayuda de un asistente de IA, y cada número tiene una fuente en la base de datos de ZapWise.", "Check your microwave's real power": "Revisa la potencia real de tu microondas", "Stick to the box time 3 times": "Sigue el tiempo de la caja 3 veces", "ZapWise couldn't start.": "ZapWise no pudo abrir.", "No camera found on this phone.": "Este teléfono no tiene cámara.", "The camera is off for ZapWise. Turn it on in Settings.": "La cámara está desactivada para ZapWise. Actívala en Ajustes.", "The camera didn't start.": "La cámara no inició.", "That photo didn't work. Try again.": "Esa foto no funcionó. Inténtalo otra vez.", "Fit the front of the box in the frame": "Pon el frente de la caja dentro del cuadro", "When the box isn't handy": "Cuando no tienes la caja a mano", "Checked by you": "Revisado por ti", "Typical for this brand": "Lo típico en esta marca", "Read from the tray": "Leído de la bandeja", "How to heat it": "Cómo calentarlo", "Not sure what this tray is. Snap the bottom to check.": "No sé qué bandeja es. Toma foto de abajo para revisar.", "The box says oven only. Raw or breaded food has to reach 165°F (74°C) all the way through, and microwaves heat uevas misiones el lunes.", "Set watts": "Poner vatios", "Add dishes": "Agregar recipientes", "Chemicals move out of plastic by diffusion, which speeds up fast as things get hotter. In ZapWise's model, DEHP moves through polypropylene about 20 times faster at 212°F (100°C) than at 158°F (70°C). In the same few minutes, 4 to 5 times more can leave the plastic.": "Los químicos salen del plástico por difusión, que se acelera mucho con el calor. En el modelo de ZapWise, el DEHP pasa por el polipropileno unas 20 veces más rápido a 212°F (100°C) que a 158°F (70°C). En los mismos minutos puede salir del plástico de 4 a 5 veces más.", "Food touching the container wall gets hotter than the middle, and the corners of square trays heat fastest.": "La comida que toca la pared del envase se calienta más que el centro, y las esquinas de las bandejas cuadradas se calientan más rápido.", "Phthalates dissolve much better in fat than in water. Based on 1,881 lab measurements, DEHP at 212°F (100°C) moves about 3,000 times more readily into a high-fat meal than into a watery one.": "Los ftalatos se disuelven mucho mejor en grasa que en agua. Según 1,881 mediciones de laboratorio, a 212°F (100°C) el DEHP pasa unas 3,000 veces más fácil a una comida grasosa que a una aguada.", "That's why ZapWise checks how fatty a meal is (from the nutrition label), not just how long it heats.": "Por eso ZapWise revisa qué tan grasosa es la comida (según la etiqueta de nutrición), no solo cuánto tiempo se calienta.", "Phthalates": "Ftalatos", "DEHP, DBP, BBP and DINP are used to make plastic soft. EFSA set a combined daily limit of 50 µg per kg of body weight, counted as DEHP.": "DEHP, DBP, BBP y DINP se usan para hacer suave el plástico. La EFSA puso un límite diario combinado de 50 µg por kg de peso, contado como DEHP.", "Limits scale with body weight, so a 30 kg (66 lb) child hits the same share with less than half of what a 70 kg (154 lb) adult eats.": "Los límites dependen del peso, así que un niño de 30 kg (66 lb) llega a la misma parte con menos de la mitad de lo que come un adulto de 70 kg (154 lb).", "Black oven-safe trays are usually CPET, a type of PET made with an antimony catalyst. The WHO daily limit is 6 µg per kg of body weight.": "Las bandejas negras para horno casi siempre son de CPET, un tipo de PET hecho con antimonio. El límite diario de la OMS es 6 µg por kg de peso.", "For antimony, ZapWise uses values measured on a real CPET tray, because the general formula is built for organic chemicals.": "Para el antimonio, ZapWise usa valores medidos en una bandeja CPET real, porque la fórmula general es para químicos orgánicos.", "In 2023, EFSA cut its BPA limit to 0.2 ng per kg of body weight per day. The US FDA hasn't changed its view. BPA comes from polycarbonate and epoxy coatings, not the PET and PP trays ZapWise covers.": "En 2023, la EFSA bajó su límite de BPA a 0.2 ng por kg de peso al día. La FDA de EE. UU. no ha cambiado su postura. El BPA viene del policarbonato y de recubrimientos epóxicos, no de las bandejas de PET y PP que revisa ZapWise.", "There's no agreed daily limit for microplastics yet, so ZapWise doesn't give them a percentage.": "Todavía no hay un límite diario acordado para los microplásticos, así que ZapWise no les da un porcentaje.", "Only what comes out of the container while your food heats and while you eat from it. Anything that got into the food at the factory isn't counted. Every result is an estimate, not a medical test.": "Solo lo que sale del envase mientras la comida se calienta y mientras comes de él. Lo que entró a la comida en la fábrica no se cuenta. Cada resultado es un cálculo aproximado, no un examen médico.", "No meals yet": "Todavía no hay comidas", "Scan a meal, heat it, and tap Save. It shows up here.": "Escanea una comida, caliéntala y toca Guardar. Aparece aquí.", "Show a sample week": "Mostrar una semana de ejemplo", "Nothing yet today": "Nada todavía hoy", "Each bar is one day.": "Cada barra es un día.", "One meal was heated in a container that isn't made for heat.": "Una comida se calentó en un envase que no es para calentar.", "Many meals have no number yet. Add their containers to fix that.": "Muchas comidas no tienen número. Agrega sus envases para arreglarlo.", "Family": "Familia", "Everything stays on this phone unless you share a product.": "Todo se queda en este teléfono, a menos que compartas un producto.", "Daily safe limits": "Límites diarios seguros", "Lead has no safe level, so it uses a reference point instead.": "El plomo no tiene un nivel seguro, así que se usa un punto de referencia.", "Get the microwave directions and watts in the frame": "Que se vean las instrucciones de microondas y los vatios", "Added! It's marked unverified for now.": "¡Agregado! Por ahora aparece sin verificar.", "It's not in the app yet. Snap two photos and I'll add it.": "Todavía no está en la app. Toma dos fotos y lo agrego.", "Couldn't find a time. Type it below.": "No encontré el tiempo. Escríbelo abajo.", "The box says not to microwave it, so I'll save it as oven-only.": "La caja dice que no se use microondas, así que lo guardo como solo horno.", "The side with the number in a triangle": "El lado con el número dentro de un triángulo", "Total fat in the box (g)": "Grasa total en la caja (g)", "Fat per serving × servings per box.": "Grasa por porción × porciones por caja.", "Where do you keep it?": "¿Dónde lo guardas?", "Pantry": "Alacena", "Share with Open Food Facts too (needs the barcode)": "Compartir también con Open Food Facts (necesita el código de barras)", "Your result": "Tu resultado", "Who's eating?": "¿Quién va a comer?", "This container isn't made for heat.": "Este envase no es para calentar.", "almost 0%": "casi 0%", "No data on this container yet": "Todavía no hay datos de este envase", "No lab data to go on yet.": "Todavía no hay datos de laboratorio.", "I need the box's microwave directions to work this out. On a plate, there's no plastic to worry about. elada en una taza medidora de vidrio de 2 tazas.\n2. Prende el microondas en ALTO y toca Empezar aquí al mismo tiempo.\n3. Toca Parar cuando el agua hierva.", "Under 2 min: 1000 W or more. About 2:30: 800 W. About 3 min: 650 to 700 W.": "Menos de 2 min: 1000 W o más. Unos 2:30: 800 W. Unos 3 min: 650 a 700 W.", "It's boiling": "Ya hierve", "Saved only on this phone. Used to size the daily limit.": "Se guarda solo en este teléfono. Sirve para calcular el límite diario.", "This deletes your kitchen, shelf, log, quests, stars, family and added products from this phone.": "Esto borra de este teléfono tu cocina, repisa, registro, misiones, estrellas, familia y productos agregados.", "Then every scan fits your kitchen.": "Así cada escaneo se ajusta a tu cocina.", "Older microwaves can run weaker than their label says.": "Los microondas viejos pueden ser más débiles de lo que dice su etiqueta.", "No plastic in the heat means almost 0%.": "Sin plástico en el calor, casi 0%.", "Extra minutes can double what gets into food.": "Los minutos de más pueden duplicar lo que pasa a la comida.", "Add a container to your shelf": "Agrega un recipiente a tu repisa", "Save your first meal": "Guarda tu primera comida", "Tap Zappy and do the boil test": "Toca a Zappy y haz la prueba de hervor", "Heat on a plate, in glass or in a pot, then save": "Calienta en plato, vidrio u olla, y guarda", "Heat for the box time, then save": "Calienta el tiempo de la caja, y guarda", "Unlocks after your first quest.": "Se abre después de tu primera misión.", "Quests count how you heat, not how often.": "Las misiones cuentan cómo calientas, no cuántas veces.", "Black oven tray (#1)": "Bandeja negra para horno (#1)", "Microwave-safe plastic (#5)": "Plástico apto para microondas (#5)", "Paper plate or fiber box": "Plato de papel o caja de fibra", "Take-out tub": "Envase para llevar", "Clear hard plastic (#6)": "Plástico duro transparente (#6)", "Melamine or bamboo dish": "Plato de melamina o bambú", "No plastic touches your food. Rest any plastic lid loosely on top.": "Ningún plástico toca tu comida. Pon cualquier tapa de plástico suelta encima.", "No plastic touches your food.": "Ningún plástico toca tu comida.", "Safe to microwave, but some chemicals can still seep into hot, oily food.": "Apto para microondas, pero algunos químicos pueden pasar a comida caliente y grasosa.", "Based on lab tests.": "Basado en pruebas de laboratorio.", "No data on this container yet.": "Todavía no hay datos de este envase.", "Your shelf": "Tu repisa", "Nothing here yet. Add the containers you heat food in.": "Aquí no hay nada. Agrega los recipientes donde calientas comida.", "Get the number in the triangle and words like \"microwave safe\" in the frame": "Que se vean el número del triángulo y palabras como \"microwave safe\"", "Recognized from the photo.": "Reconocido en la foto.", "Narrowed it down. Which one is yours?": "Ya hay menos opciones. ¿Cuál es el tuyo?", "Nickname, like Mom's glass box (optional)": "Apodo, como el recipiente de vidrio de mamá (opcional)", "Add to my shelf": "Agregar a mi repisa", "Flip the tray and snap the bottom. The number in the triangle tells trays apart. Color doesn't.": "Voltea la bandeja y toma foto de abajo. El número del triángulo distingue las bandejas. El color no.", "Snap it from the side. If there's a number in a triangle on the bottom, snap that too.": "Tómale foto de lado. Si tiene un número dentro de un triángulo abajo, tómale foto también.", "Or pick it from the list": "O elígelo de la lista", "Retake photo": "Tomar otra foto", "Your shelf is empty. Add a container first.": "Tu repisa está vacía. Primero agrega un recipiente.", "That's less time than the box. Make sure the center is steaming hot (165°F).": "Es menos tiempo que el de la caja. Asegúrate de que el centro esté humeante (165°F).", "This gets hotter than the container is made for.": "Esto se calienta más de lo que aguanta el envase.", "The plastic gets hotter than the model was t  puede deformar o derretir.", "It softens around 150°F, cooler than reheated food.": "Se ablanda a unos 150°F, menos que la comida recalentada.", "Foam tray or cup": "Bandeja o vaso de espuma (unicel)", "It's only made for up to 170°F. Reheated food gets hotter.": "Solo aguanta hasta 170°F. La comida recalentada se pone más caliente.", "Metal can spark in the microwave.": "El metal puede sacar chispas en el microondas.", "Not for hot food or the microwave. Heat can make it release chemicals.": "No es para comida caliente ni microondas. El calor puede hacer que suelte químicos.", "No plastic touches your food. Skip plates with gold or silver trim.": "Ningún plástico toca tu comida. Evita platos con bordes dorados o plateados.", "The food comes out of the package, so no plastic gets heated.": "La comida sale del envase, así que no se calienta plástico.", "US popcorn bags no longer use PFAS coatings.": "Las bolsas de palomitas de EE. UU. ya no usan recubrimientos PFAS.", "These get much hotter than boiling, so I can't estimate them.": "Estos se calientan mucho más que el hervor, así que no puedo calcularlos.", "Irgafos 168 (antioxidant)": "Irgafos 168 (antioxidante)", "Lead": "Plomo", "Steps from the box ": "Pasos de la caja ", "of your daily safe limit": "de tu límite diario seguro", "It’s on your counter. Toaster oven heating isn’t estimated yet. Food goes on the metal rack or a pan, so the plastic tray stays out.": "Ya está en tu cocina. Todavía no calculo el horno tostador. La comida va en la rejilla de metal o en una bandeja, así que la bandeja de plástico no entra.", "It’s on your counter. For cup noodles, boil water here and pour it over the noodles in a bowl. That skips the paper or foam cup.": "Ya está en tu cocina. Para la sopa instantánea, hierve el agua aquí y sírvela sobre los fideos en un tazón. Así evitas el vaso de papel o de espuma.", "Taken off the shelf": "Quitado de la repisa", "+3 stars. Your weekly quests are ready.": "+3 estrellas. Tus misiones de la semana están listas.", "Watts not set, using 1100 W": "Sin vatios, uso 1100 W", "Language / Idioma": "Language / Idioma", "1100 W for 2 min, film peeled back at one corner": "1100 W por 2 min, con la película abierta en una esquina", "Stir, then heat 1 more min": "Revuelve y calienta 1 min más", "Let it stand for 1 min": "Déjalo reposar 1 min", "Cut 3 slits in the film": "Haz 3 cortes en la película", "1100 W for 3 min 30 s": "1100 W por 3 min 30 s", "Add water to the fill line": "Agrega agua hasta la línea", "Stir in the cheese powder": "Mezcla el polvo de queso", "Black tray, CPET #1, film lid": "Bandeja negra, CPET #1, tapa de película", "Paper and PP cup, #5": "Vaso de papel y PP, #5", "Paperboard tray, oven safe": "Bandeja de cartón, apta para horno", "Oven at 400°F (204°C) for 18 to 20 min. Cook until it reaches 165°F (74°C).": "Horno a 400°F (204°C) por 18 a 20 min. Cocina hasta que llegue a 165°F (74°C).", "Don’t microwave this one": "No lo calientes en el microondas", "The box says to use the oven. Raw breaded chicken needs to reach 165°F (74°C) all the way through, and microwaves heat unevenly.": "La caja dice que uses el horno. El pollo empanizado crudo tiene que llegar a 165°F (74°C) en todas partes, y el microondas calienta disparejo.", "No estimate for oven heating yet": "Todavía no hay cálculo para horno", "The paperboard tray is made for the oven. This prototype estimates microwave heating in plastic only.": "La bandeja de cartón es para horno. Este prototipo solo calcula el microondas en plástico.", "Glass container": "Recipiente de vidrio", "Ceramic plate": "Plato de cerámica", "Deli tub": "Envase de comida para llevar", "Foam box": "Caja de espuma (unicel)", "Clear takeout clamshell": "Envase transparente con tapa", "Metal pot": "Olla de metal", "PP cup": "Vaso de PP", "Paperboard tray": "Bandeja de cartón", "Black CPET tray": "Bandeja negra de CPET", "Glass, PP #5 lid": "Vidrio, tapa de PP #5", "In the tray, microwave": "En la bandeja, microondas", "On your 900 W microwave": "En tu microondas de 900 W", "total heating time": "tiempo total", "of your daily limit": "de tu límite diario", "from this tray": "de esta bandeja", "from this cup": "de este vaso", "from this tub": "de este envase", "from this plate": "de este plato", "from this pot": "de esta olla", "from this glass container": "de este recipiente de vidrio", "near": "casi", "Sample numbers": "Números de muestra", "Sample photo in this demo": "Foto de muestra en esta demo", "Sample boxes for this demo. In the real app this is your camera.": "Cajas de muestra para esta demo. En la app real aquí está tu cámara.", "For this demo, pick the photo you would take.": "Para esta demo, elige la foto que tomarías.", "Counts what moves from the container during heating only. This is an estimate, not a diagnosis.": "Cuenta solo lo que sale del envase al calentar. Es un cálculo aproximado, no un diagnóstico.", "This counts only what moves from the container while it heats. Chemicals added in the factory aren’t included.": "Esto cuenta solo lo que pasa del envase a la comida al calentarla. Los químicos de la fábrica no se incluyen.", "Also share the packaging info with Open Food Facts": "Compartir también la información del envase con Open Food Facts", "It’s not in our list yet. Two photos let me read the cooking steps and the container. Others will see it after a second person confirms it.": "Todavía no está en la lista. Con dos fotos puedo leer los pasos y el envase. Otras personas lo verán cuando alguien más lo confirme.", "It’s on your counter. Air fryer heating isn’t estimated in this prototype yet, but I’ll suggest it once it is.": "Ya está en tu cocina. Este prototipo todavía no calcula la freidora de aire, pero te la sugeriré cuando pueda.", "Pick what you have. It shows up on your counter.": "Elige lo que tienes. Aparece en tu cocina.", "Heating food in a metal pot adds no plastic chemicals. When a meal can go in a pot, I list it as a choice.": "Calen
