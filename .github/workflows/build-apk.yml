# Builds the Android APK on GitHub's servers, for when no computer with Flutter is at hand.
# Push to GitHub (or press "Run workflow" on the Actions tab); the APK appears under the run's Artifacts.
# Open Food Facts credentials come from repository secrets and are passed with --dart-define only.
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, ui-0.5]

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Build release APK
        env:
          OFF_USER: ${{ secrets.OFF_USER }}
          OFF_PASSWORD: ${{ secrets.OFF_PASSWORD }}
        run: >
          flutter build apk --release
          --target-platform android-arm,android-arm64,android-x64
          --dart-define=OFF_USER="$OFF_USER"
          --dart-define=OFF_PASSWORD="$OFF_PASSWORD"
      - uses: actions/upload-artifact@v4
        with:
          name: zapwise-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
